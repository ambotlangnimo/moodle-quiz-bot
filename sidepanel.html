<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Bot Log</title>
<style>
body { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; background: #0f172a; color: #94a3b8; margin: 0; padding: 8px; }
h1 { font-size: 14px; color: #e94560; margin: 0 0 8px; }
#log { white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.log-info { color: #94a3b8; }
.log-success { color: #4ade80; }
.log-warn { color: #fbbf24; }
.log-error { color: #f87171; }
#clearBtn { position: fixed; top: 8px; right: 8px; background: #374151; color: #d1d5db; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 11px; }
</style>
</head>
<body>
<h1>Quiz Bot Log</h1>
<button id="clearBtn">Clear</button>
<div id="log">Waiting for logs...</div>
<script src="sidepanel.js"></script>
</body>
</html>
