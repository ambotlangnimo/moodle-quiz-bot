<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { width: 200px; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; margin: 0; padding: 12px; }
h2 { font-size: 14px; color: #e94560; margin: 0 0 8px; text-align: center; }
.btn { width: 100%; padding: 6px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; margin-bottom: 4px; }
#toggleBtn { background: #2563eb; color: white; }
#toggleBtn.active { background: #059669; }
#toggleBtn:hover { opacity: 0.85; }
#optionsBtn { background: #374151; color: #d1d5db; }
#optionsBtn:hover { background: #4b5563; }
</style>
</head>
<body>
<h2>Moodle Quiz Bot</h2>
<button class="btn" id="toggleBtn">Enable</button>
<button class="btn" id="optionsBtn">Options</button>
<script src="popup.js"></script>
</body>
</html>
